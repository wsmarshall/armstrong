[package]
name = "armstrong"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "armstrong"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"]}

#derive (optional) needed for (De)Serialize macros
#not included by default to avoid unnec. dependencies 
serde = { version = "1", features = ["derive"]}

[dev-dependencies]
reqwest = "0.11"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]