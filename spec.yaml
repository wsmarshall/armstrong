name: armstrong
#region slug sfo3 for San Francisco
region: sfo3
services:
  - name: armstrong
    #relative to repository root
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      #deploy a new version on every commit to main (CD)
      deploy_on_push: true
      repo: wsmarshall/armstrong
    #active probe used by DigOce to check if app is "healthy"
    health_check:
      #path to our constructed health check endpoint
      http_path: /health_check
    #which port the app will listen to for incoming requests
    #NB: needs to match port # in configuration/production.yaml
    http_port: 8000
    #for actual prod, >=2, but trying to keep costs manageable...
    instance_count: 1
    instance_size_slug: basic-xxs
    #all incoming requests should be routed to our app
    routes:
      - path: /
databases:
  #'PG' is Postgres
  - engine: PG
    #database name
    name: newsletter
    #keeping costs down:
    num_nodes: 1
    size: db-s-dev-database 
    #Postgres version number
    version: "12"